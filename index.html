<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>База отказов ПНК</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-amber: #b45309;
      --accent-amber-bg: #fffbeb;
      --accent-amber-border: #fde68a;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.45;
      padding-bottom: 84px;
    }

    /* Экран входа */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }

    /* Шапка и навигация */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 8px;
      max-width: 720px;
      margin: 0 auto;
    }

    .app-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .role-badge.readonly {
      background: #f1f5f9;
      color: var(--text-muted);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Вкладки систем */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 4px 16px 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      padding: 10px 4px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(30, 64, 175, 0.25);
    }

    /* Строка поиска */
    .search-wrap {
      padding: 0 16px 12px;
      position: relative;
      max-width: 720px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 40px 0 14px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    .clear-search {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-62%);
      background: #cbd5e1;
      color: #ffffff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .stats-bar {
      padding: 10px 16px 2px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 720px;
      margin: 0 auto;
    }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 5px;
    }

    /* Контейнер карточек */
    .container {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Карточка отказа */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .symptom {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.38;
    }

    .edit-btn {
      flex-shrink: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .edit-btn:active {
      background: var(--border);
    }

    /* Единый поток блоков внутри карточки */
    .blocks-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .solution-variant {
      background: var(--primary-light);
      border-left: 3.5px solid var(--primary);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14.5px;
      color: #1e293b;
    }

    .solution-variant-title {
      font-weight: 500;
    }

    .inline-arrow {
      color: var(--primary);
      font-weight: 700;
      padding: 0 3px;
    }

    .tree-branches {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 2px dashed #93c5fd;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tree-branch {
      background: #ffffff;
      border: 1px solid var(--primary-border);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13.5px;
      color: #334155;
    }

    .branch-arrow {
      color: var(--primary);
      font-weight: 700;
      margin-right: 4px;
    }

    .note-box {
      padding: 9px 12px;
      background: var(--accent-amber-bg);
      border-left: 3.5px solid #f59e0b;
      border-radius: 8px;
      font-size: 13.5px;
      color: #78350f;
    }

    .note-label {
      font-weight: 700;
      margin-right: 4px;
    }

    mark {
      background: #fde047;
      color: #0f172a;
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Плавающая кнопка добавления */
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(30, 64, 175, 0.35);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 60;
    }

    /* Модальное окно */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 28px;
      box-shadow: 0 -4px 25px rgba(0,0,0,0.15);
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
      }
      .modal-sheet {
        border-radius: 16px;
        margin: 16px;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .close-modal {
      background: var(--bg);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      background: #ffffff;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .editor-block {
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .editor-block.is-note {
      background: var(--accent-amber-bg);
      border-color: var(--accent-amber-border);
    }

    .editor-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .block-type-tag {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--primary);
    }

    .editor-block.is-note .block-type-tag {
      color: var(--accent-amber);
    }

    .block-controls {
      display: flex;
      gap: 4px;
    }

    .btn-icon {
      background: #ffffff;
      border: 1px solid var(--border);
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-danger {
      color: #dc2626;
      border-color: #fecaca;
      background: #fef2f2;
    }

    .add-buttons-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn-small {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary);
    }

    .btn-small.note-add {
      color: var(--accent-amber);
      border-color: var(--accent-amber-border);
      background: var(--accent-amber-bg);
    }

    .branch-editor-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      padding-left: 10px;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary:disabled, .btn-delete-fault:disabled {
      opacity: 0.6;
    }

    .btn-delete-fault {
      width: 100%;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      display: none;
    }

    .loader, .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- Экран входа -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-title">База отказов ПНК</div>
      <div class="auth-sub">Доступ только для авторизованных пользователей</div>
      <div id="authError" class="auth-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">Войти</button>
      </form>
    </div>
  </div>

  <!-- Основной интерфейс приложения -->
  <div id="mainApp" style="display: none;">
    <div class="header">
      <div class="top-bar">
        <div class="app-title">База отказов ПНК</div>
        <div class="top-actions">
          <div id="roleBadge" class="role-badge">Загрузка...</div>
          <button id="logoutBtn" class="logout-btn" title="Выйти">Выйти</button>
        </div>
      </div>
      <div class="tabs" id="tabsContainer"></div>
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по выбранной системе..." autocomplete="off">
        <button id="clearSearch" class="clear-search" title="Очистить">×</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">Загрузка данных...</span>
      <span><span class="live-dot"></span><span id="userEmailLabel"></span></span>
    </div>

    <div class="container" id="cardsContainer">
      <div class="loader">Загрузка базы отказов...</div>
    </div>

    <button id="fabAdd" class="fab">+ Добавить отказ</button>
  </div>

  <!-- Модальное окно добавления / редактирования -->
  <div class="modal-backdrop" id="editorModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Новый отказ</div>
        <button class="close-modal" id="closeModalBtn">×</button>
      </div>

      <input type="hidden" id="editFaultId">

      <div class="form-group">
        <label class="form-label">Система</label>
        <select id="editSystem" class="form-control"></select>
      </div>

      <div class="form-group">
        <label class="form-label">Внешнее проявление отказа</label>
        <textarea id="editSymptom" class="form-control" rows="2" placeholder="Например: Горит предохранитель на УК..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Способы устранения и примечания (меняйте порядок стрелками ↑ ↓)</label>
        <div id="blocksEditorList"></div>
        <div class="add-buttons-row">
          <button type="button" class="btn-small" id="addVariantBtn">+ Вариант устранения</button>
          <button type="button" class="btn-small note-add" id="addNoteBtn">+ Примечание</button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="saveFaultBtn">Сохранить в базу</button>
      <button type="button" class="btn-delete-fault" id="deleteFaultBtn">Удалить этот отказ</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ SUPABASE (Project Settings -> Data API / API Keys)
    // =========================================================================
    const SUPABASE_URL = 'https://bjnrtoqawetgnimnffud.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_t0FNkzyiUC7q5GAdnM484w_TQvA5Zm9';
    // =========================================================================

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let APP_STATE = {
      systems: ['КП1', 'КП2', 'КП3', 'ДИСС'],
      currentSystem: 'КП1',
      canEdit: false,
      userEmail: '',
      faults: [] // Единый массив всех записей из таблицы faults
    };

    let realtimeChannel = null;

    // --- Авторизация и проверка сессии ---
    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) {
        await initAuthorizedApp(session.user);
      } else {
        showAuthScreen();
      }
    }

    function showAuthScreen(errorMsg = '') {
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
      const errBox = document.getElementById('authError');
      if (errorMsg) {
        errBox.textContent = errorMsg;
        errBox.style.display = 'block';
      } else {
        errBox.style.display = 'none';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.textContent = 'Вход...';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      btn.disabled = false;
      btn.textContent = 'Войти';

      if (error) {
        showAuthScreen('Неверный логин или пароль');
        return;
      }
      if (data.user) {
        await initAuthorizedApp(data.user);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (realtimeChannel) sb.removeChannel(realtimeChannel);
      await sb.auth.signOut();
      showAuthScreen();
    });

    async function initAuthorizedApp(user) {
      APP_STATE.userEmail = user.email;
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      document.getElementById('userEmailLabel').textContent = user.email;

      // Проверяем роль пользователя в таблице user_roles
      const { data: roleRow } = await sb
        .from('user_roles')
        .select('role')
        .eq('email', user.email)
        .maybeSingle();

      if (!roleRow) {
        await sb.auth.signOut();
        showAuthScreen('Вашему аккаунту не предоставлен доступ к этой базе.');
        return;
      }

      APP_STATE.canEdit = roleRow.role === 'editor';
      const badge = document.getElementById('roleBadge');
      if (APP_STATE.canEdit) {
        badge.textContent = 'Редактор';
        badge.classList.remove('readonly');
        document.getElementById('fabAdd').style.display = 'flex';
      } else {
        badge.textContent = 'Только просмотр';
        badge.classList.add('readonly');
        document.getElementById('fabAdd').style.display = 'none';
      }

      renderTabs();
      await loadAllFaults();
      subscribeRealtime();
    }

    // --- Загрузка данных и автообновление в реальном времени ---
    async function loadAllFaults() {
      const { data, error } = await sb
        .from('faults')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        document.getElementById('cardsContainer').innerHTML =
          `<div class="empty-state">Ошибка загрузки данных: ${escapeHtml(error.message)}</div>`;
        return;
      }

      APP_STATE.faults = data || [];
      renderCards();
    }

    function subscribeRealtime() {
      if (realtimeChannel) sb.removeChannel(realtimeChannel);

      realtimeChannel = sb
        .channel('faults-live-sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'faults' }, (payload) => {
          if (payload.eventType === 'INSERT') {
            if (!APP_STATE.faults.some(f => f.id === payload.new.id)) {
              APP_STATE.faults.push(payload.new);
            }
          } else if (payload.eventType === 'UPDATE') {
            const idx = APP_STATE.faults.findIndex(f => f.id === payload.new.id);
            if (idx !== -1) APP_STATE.faults[idx] = payload.new;
          } else if (payload.eventType === 'DELETE') {
            APP_STATE.faults = APP_STATE.faults.filter(f => f.id !== payload.old.id);
          }
          renderCards();
        })
        .subscribe();
    }

    // --- Морфологический поиск ---
    function stemRu(word) {
      word = word.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9-]/g, '');
      if (word.length < 4) return word;
      const rvMatch = word.match(/[аеиоуыэюя]/);
      if (!rvMatch) return word;
      const start = rvMatch.index + 1;
      const head = word.slice(0, start);
      let rv = word.slice(start);

      const perfective = /(ив|ивши|ившись|ыв|ывши|ывшись|вши|вшись)$/;
      const reflexive = /(ся|сь)$/;
      const adjective = /(ее|ие|ые|ое|ими|ыми|ей|ий|ый|ой|ем|им|ым|ом|его|ого|ему|ому|их|ых|ую|юю|ая|яя|ою|ею)$/;
      const participle = /(ем|нн|вш|ющ|щ)$/;
      const verb = /(ила|ыла|ена|ейте|уйте|ите|или|ыли|ей|уй|ил|ыл|им|ым|ен|ило|ыло|ено|ят|ует|уют|ит|ыт|ены|ить|ыть|ишь|ую|ю)$/;
      const noun = /(а|ев|ов|ие|ье|е|иями|ями|ами|еи|ии|и|ией|ей|ой|ий|й|иям|ям|ием|ем|ам|ом|о|у|ах|иях|ях|ы|ь|ию|ью|ю|ия|ья|я)$/;

      if (perfective.test(rv)) {
        rv = rv.replace(perfective, '');
      } else {
        rv = rv.replace(reflexive, '');
        if (adjective.test(rv)) {
          rv = rv.replace(adjective, '');
          rv = rv.replace(participle, '');
        } else if (verb.test(rv)) {
          rv = rv.replace(verb, '');
        } else {
          rv = rv.replace(noun, '');
        }
      }
      rv = rv.replace(/и$/, '');
      rv = rv.replace(/(ость|ост)$/, '');
      rv = rv.replace(/ь$/, '');
      rv = rv.replace(/нн$/, 'н');
      return head + rv;
    }

    function normalizeText(str) {
      return str.toLowerCase().replace(/ё/g, 'е');
    }

    function matchesQuery(item, query) {
      if (!query.trim()) return true;
      const cleanSol = (item.solution || '').replace(/\[ПРИМ\]/gi, ' ');
      const fullText = normalizeText(`${item.symptom} ${cleanSol} ${item.note || ''}`);
      const textWords = fullText.split(/[^а-яa-z0-9-]+/).filter(Boolean);
      const textStems = textWords.map(stemRu);

      const queryTokens = normalizeText(query).split(/\s+/).filter(Boolean);
      return queryTokens.every(token => {
        const qStem = stemRu(token);
        return textWords.some((w, idx) => w.includes(token) || (qStem.length >= 3 && textStems[idx].startsWith(qStem)));
      });
    }

    function highlightText(rawText, query) {
      let escaped = escapeHtml(rawText);
      escaped = escaped.replace(/-&gt;/g, '<span class="inline-arrow">➔</span>');

      if (!query.trim()) return escaped;
      const tokens = normalizeText(query).split(/\s+/).filter(t => t.length >= 2);
      if (!tokens.length) return escaped;

      const stems = tokens.map(stemRu);
      return escaped.replace(/(<[^>]+>)|([а-яА-ЯёЁa-zA-Z0-9-]+)/g, (full, tag, word) => {
        if (tag) return tag;
        const norm = normalizeText(word);
        const mStem = stemRu(norm);
        const hit = tokens.some((t, i) => norm.includes(t) || (stems[i].length >= 3 && mStem.startsWith(stems[i])));
        return hit ? `<mark>${word}</mark>` : word;
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // --- Разбор блоков карточки ---
    function parseCardBlocks(solutionText, legacyNoteText) {
      const blocks = [];
      let currentVariant = null;

      if (solutionText) {
        const lines = solutionText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

        lines.forEach(line => {
          if (/^\[ПРИМ\]/i.test(line)) {
            if (currentVariant) {
              blocks.push(currentVariant);
              currentVariant = null;
            }
            blocks.push({
              type: 'note',
              text: line.replace(/^\[ПРИМ\]\s*/i, '')
            });
          } else if (line.startsWith('*')) {
            if (currentVariant) blocks.push(currentVariant);
            currentVariant = {
              type: 'variant',
              title: line.replace(/^\*+\s*/, ''),
              branches: []
            };
          } else if (line.startsWith('->') || line.startsWith('→')) {
            if (!currentVariant) {
              currentVariant = { type: 'variant', title: '', branches: [] };
            }
            currentVariant.branches.push(line.replace(/^(->|→)\s*/, ''));
          } else {
            if (currentVariant) blocks.push(currentVariant);
            currentVariant = {
              type: 'variant',
              title: line,
              branches: []
            };
          }
        });

        if (currentVariant) blocks.push(currentVariant);
      }

      if (legacyNoteText && legacyNoteText.trim()) {
        legacyNoteText.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(nLine => {
          blocks.push({
            type: 'note',
            text: nLine.replace(/^\[ПРИМ\]\s*/i, '')
          });
        });
      }

      return blocks;
    }

    // --- Отрисовка интерфейса ---
    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = APP_STATE.systems.map(sys => `
        <button class="tab-btn ${sys === APP_STATE.currentSystem ? 'active' : ''}" onclick="selectSystem('${sys}')">
          ${sys}
        </button>
      `).join('');
    }

    function selectSystem(sys) {
      APP_STATE.currentSystem = sys;
      renderTabs();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      const query = document.getElementById('searchInput').value;
      const list = APP_STATE.faults.filter(item => item.system === APP_STATE.currentSystem);
      const filtered = list.filter(item => matchesQuery(item, query));

      document.getElementById('statsCount').textContent = 
        query.trim() 
          ? `Найдено в ${APP_STATE.currentSystem}: ${filtered.length} из ${list.length}` 
          : `Всего в ${APP_STATE.currentSystem}: ${list.length}`;

      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">По вашему запросу в системе <b>${APP_STATE.currentSystem}</b> ничего не найдено.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const blocks = parseCardBlocks(item.solution, item.note);

        const blocksHtml = blocks.map(block => {
          if (block.type === 'note') {
            return `<div class="note-box"><span class="note-label">Примечание:</span>${highlightText(block.text, query)}</div>`;
          }

          const branchesHtml = block.branches.length
            ? `<div class="tree-branches">
                ${block.branches.map(b => `<div class="tree-branch"><span class="branch-arrow">↳</span>${highlightText(b, query)}</div>`).join('')}
               </div>`
            : '';

          return `
            <div class="solution-variant">
              ${block.title ? `<div class="solution-variant-title">${highlightText(block.title, query)}</div>` : ''}
              ${branchesHtml}
            </div>
          `;
        }).join('');

        const editBtnHtml = APP_STATE.canEdit
          ? `<button class="edit-btn" onclick="openEditor(${item.id})">Изменить</button>`
          : '';

        return `
          <div class="card">
            <div class="card-header">
              <div class="symptom">${highlightText(item.symptom, query)}</div>
              ${editBtnHtml}
            </div>
            <div class="blocks-list">${blocksHtml}</div>
          </div>
        `;
      }).join('');
    }

    // --- Конструктор в модальном окне ---
    function moveEditorBlock(btn, direction) {
      const block = btn.closest('.editor-block');
      const parent = block.parentElement;
      if (direction === -1 && block.previousElementSibling) {
        parent.insertBefore(block, block.previousElementSibling);
      } else if (direction === 1 && block.nextElementSibling) {
        parent.insertBefore(block.nextElementSibling, block);
      }
    }

    function createVariantEditorBlock(title = '', branches = []) {
      const div = document.createElement('div');
      div.className = 'editor-block';
      div.dataset.type = 'variant';
      div.innerHTML = `
        <div class="editor-block-header">
          <span class="block-type-tag">Способ устранения</span>
          <div class="block-controls">
            <button type="button" class="btn-icon" title="Переместить выше" onclick="moveEditorBlock(this, -1)">↑</button>
            <button type="button" class="btn-icon" title="Переместить ниже" onclick="moveEditorBlock(this, 1)">↓</button>
            <button type="button" class="btn-icon btn-danger" title="Удалить" onclick="this.closest('.editor-block').remove()">✕</button>
          </div>
        </div>
        <textarea class="form-control variant-title-input" rows="2" placeholder="Опишите способ устранения...">${escapeHtml(title)}</textarea>
        <div class="branches-container"></div>
        <button type="button" class="btn-small" style="margin-top:6px; padding:5px 9px; font-size:12px;" onclick="addBranchInput(this.previousElementSibling)">+ Ветка (Если → То)</button>
      `;
      const branchesContainer = div.querySelector('.branches-container');
      branches.forEach(b => addBranchInput(branchesContainer, b));
      return div;
    }

    function createNoteEditorBlock(text = '') {
      const div = document.createElement('div');
      div.className = 'editor-block is-note';
      div.dataset.type = 'note';
      div.innerHTML = `
        <div class="editor-block-header">
          <span class="block-type-tag">Примечание</span>
          <div class="block-controls">
            <button type="button" class="btn-icon" title="Переместить выше" onclick="moveEditorBlock(this, -1)">↑</button>
            <button type="button" class="btn-icon" title="Переместить ниже" onclick="moveEditorBlock(this, 1)">↓</button>
            <button type="button" class="btn-icon btn-danger" title="Удалить" onclick="this.closest('.editor-block').remove()">✕</button>
          </div>
        </div>
        <textarea class="form-control note-text-input" rows="2" placeholder="Текст примечания...">${escapeHtml(text)}</textarea>
      `;
      return div;
    }

    function addBranchInput(container, text = '') {
      const row = document.createElement('div');
      row.className = 'branch-editor-row';
      row.innerHTML = `
        <input type="text" class="form-control branch-input" style="font-size:13.5px; padding:7px 10px;" placeholder="Подпункт ветвления..." value="${escapeHtml(text)}">
        <button type="button" class="btn-icon btn-danger" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    }

    function openEditor(faultId = null) {
      const modal = document.getElementById('editorModal');
      const sysSelect = document.getElementById('editSystem');
      const deleteBtn = document.getElementById('deleteFaultBtn');
      sysSelect.innerHTML = APP_STATE.systems.map(s => `<option value="${s}">${s}</option>`).join('');
      sysSelect.value = APP_STATE.currentSystem;

      const blocksList = document.getElementById('blocksEditorList');
      blocksList.innerHTML = '';

      if (faultId) {
        const item = APP_STATE.faults.find(x => x.id === faultId);
        document.getElementById('modalTitle').textContent = 'Редактировать отказ';
        document.getElementById('editFaultId').value = faultId;
        document.getElementById('editSymptom').value = item.symptom;
        sysSelect.value = item.system;
        sysSelect.disabled = false;
        deleteBtn.style.display = 'block';

        const parsedBlocks = parseCardBlocks(item.solution, item.note);
        if (parsedBlocks.length) {
          parsedBlocks.forEach(b => {
            if (b.type === 'note') {
              blocksList.appendChild(createNoteEditorBlock(b.text));
            } else {
              blocksList.appendChild(createVariantEditorBlock(b.title, b.branches));
            }
          });
        } else {
          blocksList.appendChild(createVariantEditorBlock());
        }
      } else {
        document.getElementById('modalTitle').textContent = 'Новый отказ';
        document.getElementById('editFaultId').value = '';
        document.getElementById('editSymptom').value = '';
        sysSelect.disabled = false;
        deleteBtn.style.display = 'none';
        blocksList.appendChild(createVariantEditorBlock());
      }

      modal.classList.add('open');
    }

    document.getElementById('addVariantBtn').onclick = () => {
      document.getElementById('blocksEditorList').appendChild(createVariantEditorBlock());
    };

    document.getElementById('addNoteBtn').onclick = () => {
      document.getElementById('blocksEditorList').appendChild(createNoteEditorBlock());
    };

    document.getElementById('closeModalBtn').onclick = () => {
      document.getElementById('editorModal').classList.remove('open');
    };

    document.getElementById('fabAdd').onclick = () => openEditor(null);

    document.getElementById('saveFaultBtn').onclick = async function() {
      const btn = this;
      const symptom = document.getElementById('editSymptom').value.trim();
      if (!symptom) {
        alert('Укажите внешнее проявление отказа');
        return;
      }

      const editorBlocks = Array.from(document.querySelectorAll('#blocksEditorList .editor-block'));
      const lines = [];

      editorBlocks.forEach(block => {
        if (block.dataset.type === 'note') {
          const noteVal = block.querySelector('.note-text-input').value.trim();
          if (noteVal) {
            noteVal.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
              lines.push(`[ПРИМ] ${line}`);
            });
          }
        } else {
          const title = block.querySelector('.variant-title-input').value.trim();
          const branches = Array.from(block.querySelectorAll('.branch-input'))
            .map(inp => inp.value.trim())
            .filter(Boolean);

          if (title) {
            const singleLineTitle = title.replace(/\r?\n+/g, ' ');
            lines.push(`* ${singleLineTitle}`);
          }
          branches.forEach(b => lines.push(`-> ${b}`));
        }
      });

      if (!lines.length) {
        alert('Добавьте хотя бы один способ устранения или примечание');
        return;
      }

      const faultId = document.getElementById('editFaultId').value;
      const record = {
        system: document.getElementById('editSystem').value,
        symptom: symptom,
        solution: lines.join('\n'),
        note: ''
      };

      btn.disabled = true;
      btn.textContent = 'Сохранение...';

      let res;
      if (faultId) {
        res = await sb.from('faults').update(record).eq('id', Number(faultId)).select().single();
      } else {
        res = await sb.from('faults').insert(record).select().single();
      }

      btn.disabled = false;
      btn.textContent = 'Сохранить в базу';

      if (res.error) {
        alert('Ошибка сохранения: ' + res.error.message);
        return;
      }

      // Мгновенно обновляем локальный список, не дожидаясь события Realtime
      if (faultId) {
        const idx = APP_STATE.faults.findIndex(f => f.id === Number(faultId));
        if (idx !== -1) APP_STATE.faults[idx] = res.data;
      } else if (!APP_STATE.faults.some(f => f.id === res.data.id)) {
        APP_STATE.faults.push(res.data);
      }

      document.getElementById('editorModal').classList.remove('open');
      renderCards();
    };

    document.getElementById('deleteFaultBtn').onclick = async function() {
      const faultId = document.getElementById('editFaultId').value;
      if (!faultId) return;

      if (!confirm('Точно удалить этот отказ из базы? Это действие нельзя отменить.')) {
        return;
      }

      const btn = this;
      const saveBtn = document.getElementById('saveFaultBtn');
      btn.disabled = true;
      saveBtn.disabled = true;
      btn.textContent = 'Удаление...';

      const { error } = await sb.from('faults').delete().eq('id', Number(faultId));

      btn.disabled = false;
      saveBtn.disabled = false;
      btn.textContent = 'Удалить этот отказ';

      if (error) {
        alert('Ошибка удаления: ' + error.message);
        return;
      }

      APP_STATE.faults = APP_STATE.faults.filter(f => f.id !== Number(faultId));
      document.getElementById('editorModal').classList.remove('open');
      renderCards();
    };

    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    searchInput.addEventListener('input', () => {
      clearSearch.style.display = searchInput.value ? 'flex' : 'none';
      renderCards();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.style.display = 'none';
      renderCards();
      searchInput.focus();
    });

    checkSession();
  </script>
</body>
</html>
